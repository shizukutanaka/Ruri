name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test + coverage thresholds
        run: npm run coverage
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high || true
      - name: Build (dist ESM + d.ts)
        run: npm run build
      - name: Dist smoke test (Node ESM resolution)
        run: node -e "import('./dist/index.js').then(m => { if (typeof m.defineTuning !== 'function' || typeof m.parseScl !== 'function') throw new Error('missing exports'); })"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check embedded UI script parses
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('shell-web/index.html','utf8');const m=h.match(/<script type=\"module\">([\s\S]*?)<\/script>/);fs.writeFileSync('/tmp/ui.mjs',m[1]);"
          node --check /tmp/ui.mjs
